<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button type="button" aria-label="Menu"><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item">
            <a href="#about-me"><span class="lang-en">Homepage</span><span class="lang-zh">首页</span></a>
          </li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item">
              <a href="{{ domain }}{{ link.url }}">
                <span class="lang-en">{{ link.title }}</span><span class="lang-zh">{{ link.title_zh }}</span>
              </a>
            </li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
      <div class="lang-switch" role="group" aria-label="Language / 语言">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <span class="lang-switch__sep" aria-hidden="true">/</span>
        <button type="button" data-lang="zh" aria-pressed="false">中文</button>
      </div>
    </div>
  </div>
</div>
