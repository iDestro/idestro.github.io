name: Get Citation Data

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: google-scholar-stats
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Checkout previous citation data
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: google-scholar-stats
          path: previous-stats

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r google_scholar_crawler/requirements.txt

      - name: Fetch citation data
        id: fetch
        continue-on-error: true
        working-directory: google_scholar_crawler
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: timeout 90 python main.py

      - name: Fall back to last published stats
        if: steps.fetch.outcome != 'success'
        run: |
          if [ ! -f previous-stats/gs_data.json ] || [ ! -f previous-stats/gs_data_shieldsio.json ]; then
            echo "Fetch failed and no previous citation data exists"
            exit 1
          fi
          mkdir -p google_scholar_crawler/results
          cp previous-stats/gs_data.json previous-stats/gs_data_shieldsio.json google_scholar_crawler/results/
          echo "Google Scholar blocked or timed out; keeping previously published citation data"

      - name: Publish google-scholar-stats
        working-directory: google_scholar_crawler/results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init
          git config --local user.name "${GITHUB_ACTOR}"
          git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json
          git commit -m "Updated Citation Data"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats --force
